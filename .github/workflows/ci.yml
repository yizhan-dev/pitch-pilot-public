name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the public boundary
        run: python scripts/audit_public.py
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build and check web source
        working-directory: web
        run: |
          npm run build
          npm run lint -- --quiet
          npm test
          node --test scripts/*.node-test.mjs
      - name: Verify the service and publication audit
        run: |
          python -m unittest discover -s tests
          python -m unittest discover -s service/tests
      - name: Install the pinned agent environment
        run: |
          python -m pip install uv==0.11.31
          uv sync --project agents --frozen
      - name: Verify the real workflow with scripted agents
        run: |
          uv run --project agents python agents/example.py
          uv run --project agents python -m unittest discover -s agents/tests
